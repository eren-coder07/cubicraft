name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  TAG: v0.1.0

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Test core
        run: cargo test --release -p cubicraft-core
      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown -p cubicraft-web
      - name: wasm-bindgen
        run: |
          curl -sL -o /tmp/wb.tgz https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz
          tar -C /tmp -xzf /tmp/wb.tgz
          /tmp/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl/wasm-bindgen --target web \
            target/wasm32-unknown-unknown/release/cubicraft_web.wasm --out-dir site/pkg
      - name: Assemble site
        run: |
          mkdir -p site/assets/model
          cp web/index.html site/
          cp assets/model/Set1.psd site/assets/model/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build exe (cross, mingw)
        run: cargo build --release --target x86_64-pc-windows-gnu -p cubicraft-desktop --features desktop
      - name: Package
        run: |
          mkdir -p pkg
          cp target/x86_64-pc-windows-gnu/release/cubicraft-desktop.exe pkg/cubicraft.exe
          cp README.md pkg/
          zip -j cubicraft-windows.zip pkg/cubicraft.exe pkg/README.md
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --title "Cubicraft $TAG" --notes "Windows exe + Android APK for the clean-room Live2D engine." || true
          gh release upload "$TAG" cubicraft-windows.zip --clobber

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NDK + platform 30
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "platform-tools" "platforms;android-30" "build-tools;30.0.3" >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Generate signing keystore
        run: |
          keytool -genkeypair -keystore crates/desktop/release.keystore -alias cubicraft \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass cubicraft -keypass cubicraft \
            -dname "CN=Cubicraft, O=cubicraft" >/dev/null 2>&1
      - name: Build APK
        run: cargo apk build --release -p cubicraft-desktop
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/release/apk/cubicraft.apk cubicraft.apk
          gh release create "$TAG" --title "Cubicraft $TAG" --notes "Windows exe + Android APK for the clean-room Live2D engine." || true
          gh release upload "$TAG" cubicraft.apk --clobber

  deploy-pages:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
