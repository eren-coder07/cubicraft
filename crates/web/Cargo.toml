[package]
name = "cubicraft-web"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
cubicraft-core = { path = "../core" }
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
] }
console_error_panic_hook = "0.1"
